services:
  mongo:
    image: mongo:7
    container_name: yantra-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: yantra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  express-1:
    build:
      context: ./express-backend
      dockerfile: Dockerfile
    container_name: yantra-express-1
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/yantra_erp
      JWT_SECRET: yantra-secure-jwt-production-secret-2026
      CORS_ORIGIN: "http://localhost"
      LOG_LEVEL: info
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-100000}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-100000}
    depends_on:
      - mongo

  express-2:
    build:
      context: ./express-backend
      dockerfile: Dockerfile
    container_name: yantra-express-2
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/yantra_erp
      JWT_SECRET: yantra-secure-jwt-production-secret-2026
      CORS_ORIGIN: "http://localhost"
      LOG_LEVEL: info
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-100000}
      RATE_LIMIT_WRITE_MAX: ${RATE_LIMIT_WRITE_MAX:-100000}
    depends_on:
      - mongo

  fastapi-1:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: yantra-fastapi-1
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: production
      JWT_SECRET: yantra-secure-jwt-production-secret-2026
      NODE_API_URL: http://express_cluster/api
      MONGODB_URI: mongodb://mongo:27017/yantra_erp
      CHECKPOINTER_BACKEND: mongodb
      CORS_ORIGINS: "http://localhost"
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-100000/minute}
    depends_on:
      - mongo
      - redis

  fastapi-2:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: yantra-fastapi-2
    restart: unless-stopped
    environment:
      PORT: 8000
      ENVIRONMENT: production
      JWT_SECRET: yantra-secure-jwt-production-secret-2026
      NODE_API_URL: http://express_cluster/api
      MONGODB_URI: mongodb://mongo:27017/yantra_erp
      CHECKPOINTER_BACKEND: mongodb
      CORS_ORIGINS: "http://localhost"
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-100000/minute}
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yantra-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: yantra-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - express-1
      - express-2
      - fastapi-1
      - fastapi-2
      - frontend

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: yantra-mongo-express
    profiles: ["demo"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://host.docker.internal:27017/yantra_demo
      ME_CONFIG_OPTIONS_READONLY: "true"
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data:
