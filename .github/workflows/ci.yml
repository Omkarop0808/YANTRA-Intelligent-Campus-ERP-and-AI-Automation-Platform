name: Yantra ERP Monorepo CI

on:
  push:
    branches: [main, round3-hardening, demo-setup]
  pull_request:
    branches: [main, round3-hardening, demo-setup]

jobs:
  secrets-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Secret Check Script
        run: bash scripts/check-secrets.sh

  express-check:
    name: Express Backend Build & Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: express-backend/package-lock.json
      - name: Install dependencies, build & run tests
        run: |
          cd express-backend
          npm ci
          npm test

  frontend-check:
    name: Frontend Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies, run unit tests & build
        run: |
          cd frontend
          npm ci
          node --experimental-strip-types --test src/components/dashboard/uploadNoticeState.test.ts
          npm run build

  python-check:
    name: Python AI Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          cd python-backend
          uv sync --dev
      - name: Verify Python package imports and offline unit tests
        run: |
          cd python-backend
          uv run pytest -q tests/test_gemini_models.py tests/test_proxy_rate_limit.py tests/test_ingest.py tests/test_permission_resume.py

  e2e-service-test:
    name: End-to-End Test Suite against Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate JWT Asymmetric RSA Keys
        run: bash scripts/generate-jwt-keys.sh
      - name: Start Docker Compose Services
        run: |
          docker compose up -d mongo redis
          docker compose ps
